# forms.synergium.net — HTTP (ACME + redirect)
<VirtualHost *:80>
    ServerName forms.synergium.net
    ServerAdmin horacio@horacio-ps.com

    DocumentRoot /var/www/forms.synergium.net
    <Directory /var/www/forms.synergium.net>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <Directory /var/www/forms.synergium.net/match-dashboard>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        AuthType Basic
        AuthName "Synergium Match Pipeline"
        AuthUserFile /home/horacio/synergium-forms/.htpasswd-match-dashboard
        Require valid-user
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8090/api/
    ProxyPassReverse /api/ http://127.0.0.1:8090/api/
    ProxyPass /_/ http://127.0.0.1:8090/_/
    ProxyPassReverse /_/ http://127.0.0.1:8090/_/

    # Match dashboard: PII (emails, WhatsApp). Basic auth — see MATCH-TRACKING.md.
    <Location /match-dashboard>
        AuthType Basic
        AuthName "Synergium Match Dashboard"
        AuthUserFile /etc/apache2/synergium-match-dashboard.htpasswd
        Require valid-user
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/forms.synergium.net-error.log
    CustomLog ${APACHE_LOG_DIR}/forms.synergium.net-access.log combined
</VirtualHost>
