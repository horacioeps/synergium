  }catch(e){}
})();
</script>

<style>
.syn-toolbar{display:flex;align-items:center;gap:1rem;flex-wrap:nowrap}
.syn-lang{position:relative}
.syn-lang__btn{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .55rem;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:999px;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:.85rem;letter-spacing:.04em}
.syn-lang__btn:hover,.syn-lang__btn[aria-expanded="true"]{border-color:currentColor}
.syn-lang__globe{display:block;flex:0 0 auto}
.syn-lang__code{line-height:1}
.syn-lang__list{position:absolute;top:calc(100% + .4rem);right:0;margin:0;padding:.35rem 0;list-style:none;min-width:10.5rem;border:1px solid color-mix(in srgb,currentColor 28%,transparent);border-radius:8px;background:var(--wp--preset--color--base,#fff);color:inherit;box-shadow:0 8px 24px color-mix(in srgb,#000 16%,transparent);z-index:20}
html[data-theme="dark"] .syn-lang__list{background:#1b1b1b}
.syn-lang__list[hidden]{display:none}
.syn-lang__list li{padding:.4rem .85rem;cursor:pointer;font-size:.9rem}
.syn-lang__list li:hover,.syn-lang__list li[aria-selected="true"]{background:color-mix(in srgb,currentColor 8%,transparent)}
.syn-theme{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid color-mix(in srgb, currentColor 35%, transparent);border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.syn-theme:hover{border-color:currentColor}
.syn-theme__moon{display:none}
html[data-theme="dark"] .syn-theme__sun{display:none}
html[data-theme="dark"] .syn-theme__moon{display:block}
html[data-theme="dark"]{
  --wp--preset--color--base:#131313;
  --wp--preset--color--contrast:#FFFFFF;
  --wp--preset--color--accent-1:#4B52FF;
  --wp--preset--color--accent-2:#FF7A5C;
  --wp--preset--color--accent-3:#252525;
  --wp--preset--color--accent-4:#FFFFFF;
  --wp--preset--color--accent-5:#252525;
  --wp--preset--color--accent-6:#FFFFFF33;
  color-scheme:dark;
  background:#131313;
}
html[data-theme="light"]{color-scheme:light}
html[dir="rtl"] .syn-lang__list{right:auto;left:0}
.goog-te-banner-frame,.skiptranslate,iframe.skiptranslate,.goog-te-gadget{display:none!important}
body{top:0!important}
.gt_switcher_wrapper,.gtranslate_wrapper{display:none!important}
</style>
<script>
(function(){
  var root=document.documentElement;
  var key="syn-theme";
  var LANGS={
    es:{code:"ES",dir:"ltr",html:"es"},
    en:{code:"EN",dir:"ltr",html:"en"},
    "zh-CN":{code:"ZH",dir:"ltr",html:"zh-CN"},
    ar:{code:"AR",dir:"rtl",html:"ar"},
    ja:{code:"JA",dir:"ltr",html:"ja"},
    pt:{code:"PT",dir:"ltr",html:"pt-BR"},
    it:{code:"IT",dir:"ltr",html:"it"},
    de:{code:"DE",dir:"ltr",html:"de"}
  };
  function pref(){
    try{var s=localStorage.getItem(key);if(s==="dark"||s==="light")return s;}catch(e){}
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }
  function applyTheme(t){
    root.setAttribute("data-theme", t);
    var b=document.getElementById("syn-theme-toggle");
    if(b){
      var dark=t==="dark";
      b.setAttribute("aria-pressed", dark?"true":"false");
      b.setAttribute("aria-label", dark?"Switch to light mode / Cambiar a modo claro":"Switch to dark mode / Cambiar a modo oscuro");
    }
  }
  applyTheme(pref());
  function path(){return (location.pathname.replace(/\/+$/,"")||"/");}
  function readCookie(n){
    var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));
    return m?decodeURIComponent(m[1]):"";
  }
  function writeCookie(n,v){
    document.cookie=n+"="+v+";path=/;max-age=31536000";
    document.cookie=n+"="+v+";path=/;domain="+location.hostname+";max-age=31536000";
  }
  function clearTrans(){
    document.cookie="googtrans=;path=/;max-age=0";
    document.cookie="googtrans=;path=/;domain="+location.hostname+";max-age=0";
    try{localStorage.removeItem("syn-lang");}catch(e){}
  }
  function currentLang(){
    var p=path();
    if(p==="/es"||p.indexOf("/es/")===0) return "es";
    if(p==="/en"||p.indexOf("/en/")===0) return "en";
    var c=readCookie("googtrans");
    var m=c.match(/\/[a-zA-Z-]+\/([a-zA-Z-]+)/);
    if(m&&LANGS[m[1]]) return m[1];
    try{var s=localStorage.getItem("syn-lang");if(s&&LANGS[s]&&s!=="en")return s;}catch(e){}
    return "en";
  }
  function paintLang(lang){
    var meta=LANGS[lang]||LANGS.en;
    root.setAttribute("lang", meta.html);
    root.setAttribute("dir", meta.dir);
    var code=document.getElementById("syn-lang-code");
    if(code) code.textContent=meta.code;
    var list=document.getElementById("syn-lang-list");
    if(list){
      list.querySelectorAll("[data-lang]").forEach(function(li){
        li.setAttribute("aria-selected", li.getAttribute("data-lang")===lang?"true":"false");
      });
    }
  }
  function goLang(lang){
    try{localStorage.setItem("syn-lang", lang);}catch(e){}
    if(lang==="en"){
      clearTrans();
      if(path()!=="/") location.href="https://synergium.net/";
      else location.reload();
      return;
    }
    if(lang==="es"){
      clearTrans();
      if(path()!=="/es") location.href="https://synergium.net/es/";
      else location.reload();
      return;
    }
    writeCookie("googtrans","/en/"+lang);
    try{localStorage.setItem("syn-lang", lang);}catch(e){}
    if(path()!=="/") location.href="https://synergium.net/";
    else location.reload();
  }
  if(path()==="/en"||path().indexOf("/en/")===0){
    location.replace("https://synergium.net/");
    return;
  }
  paintLang(currentLang());
  var btn=document.getElementById("syn-lang-btn");
  var list=document.getElementById("syn-lang-list");
  if(btn&&list){
    btn.addEventListener("click", function(ev){
      ev.stopPropagation();
      var open=btn.getAttribute("aria-expanded")==="true";
      btn.setAttribute("aria-expanded", open?"false":"true");
      list.hidden=open;
    });
    list.addEventListener("click", function(ev){
      var li=ev.target.closest("[data-lang]");
      if(!li) return;
      goLang(li.getAttribute("data-lang"));
    });
    document.addEventListener("click", function(){
      btn.setAttribute("aria-expanded","false");
      list.hidden=true;
    });
  }
  document.addEventListener("click", function(ev){
    var b=ev.target.closest&&ev.target.closest("#syn-theme-toggle");
    if(!b) return;
    var next=root.getAttribute("data-theme")==="dark"?"light":"dark";
    try{localStorage.setItem(key,next);}catch(e){}
    applyTheme(next);
  });
  var langNow=currentLang();
  if(langNow!=="es"&&langNow!=="en"){
    window.googleTranslateElementInit=function(){
      if(!window.google||!google.translate) return;
      new google.translate.TranslateElement({
        pageLanguage:"en",
        includedLanguages:"zh-CN,ar,ja,pt,it,de",
        autoDisplay:false
      },"google_translate_element");
    };
    setTimeout(function(){
      if(window.doGTranslate) return;
      var s=document.createElement("script");
      s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      document.head.appendChild(s);
    },300);
  }
})();
</script>
