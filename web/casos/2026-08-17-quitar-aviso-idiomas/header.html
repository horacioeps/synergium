<script>
(function(){
  try{
    var t=localStorage.getItem("syn-theme");
    if(!t){
      t="light";
      var mq=window.matchMedia;
      if(mq){
        if(mq("(prefers-color-scheme: dark)").matches) t="dark";
      }
    }
    document.documentElement.setAttribute("data-theme",t);
  }catch(e){}
})();
</script>
<div id="google_translate_element" hidden></div>
<div class="syn-bar">

      <svg class="syn-theme__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
    </button>

<style>
.syn-kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.72;margin-bottom:0}
.syn-hero h1{font-size:clamp(1.85rem,4vw,2.85rem);line-height:1.15;max-width:20ch}
.syn-bar,.syn-toolbar,.syn-lang{overflow:visible}
.syn-bar{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;justify-content:flex-end}
.syn-nav{display:flex;align-items:center;gap:1.15rem;flex-wrap:wrap}
.syn-nav a{color:inherit;text-decoration:none;font-size:.95rem}
.syn-nav a:hover,.syn-nav a[aria-current="page"]{text-decoration:underline}
.syn-toolbar{display:flex;align-items:center;gap:1rem;flex-wrap:nowrap}
.syn-lang{position:relative;z-index:40}
.syn-lang__btn{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .55rem;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:999px;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:.85rem;letter-spacing:.04em}
.syn-lang__btn:hover,.syn-lang__btn[aria-expanded="true"]{border-color:currentColor}
.syn-lang__globe{display:block;flex:0 0 auto}
.syn-lang__code{line-height:1}
.syn-lang__list{display:none;position:absolute;top:calc(100% + .4rem);right:0;margin:0;padding:.35rem 0;list-style:none;min-width:10.5rem;border:1px solid color-mix(in srgb,currentColor 28%,transparent);border-radius:8px;background:var(--wp--preset--color--base,#fff);color:inherit;box-shadow:0 8px 24px color-mix(in srgb,#000 16%,transparent);z-index:50}
.syn-lang:focus-within .syn-lang__list,.syn-lang.is-open .syn-lang__list{display:block}
html[data-theme="dark"] .syn-lang__list{background:#1b1b1b}
.syn-lang__list li{margin:0}
.syn-lang__list a{display:block;padding:.4rem .85rem;color:inherit;text-decoration:none;font-size:.9rem;cursor:pointer}
.syn-lang__list a:hover,.syn-lang__list li[aria-selected="true"] a{background:color-mix(in srgb,currentColor 8%,transparent)}
.syn-theme{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid color-mix(in srgb, currentColor 35%, transparent);border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.syn-theme:hover{border-color:currentColor}
.syn-theme__moon{display:none}
html[data-theme="dark"] .syn-theme__sun{display:none}
html[data-theme="dark"] .syn-theme__moon{display:block}
html[data-theme="dark"]{
  --wp--preset--color--base:#131313;
  --wp--preset--color--contrast:#FFFFFF;
  --wp--preset--color--accent-1:#4B52FF;
  --wp--preset--color--accent-2:#FF7A5C;
  --wp--preset--color--accent-3:#252525;
  --wp--preset--color--accent-4:#FFFFFF;
  --wp--preset--color--accent-5:#252525;
  --wp--preset--color--accent-6:#FFFFFF33;
  color-scheme:dark;
  background:#131313;
}
html[data-theme="light"]{color-scheme:light}
html[dir="rtl"] .syn-lang__list{right:auto;left:0}
.goog-te-banner-frame,.skiptranslate,iframe.skiptranslate,.goog-te-gadget{display:none!important}
body{top:0!important}
.gt_switcher_wrapper,.gtranslate_wrapper{display:none!important}
</style>
<script>
(function(){
  var root=document.documentElement;
  var themeKey="syn-theme";
  var LANGS={
    es:{code:"ES",dir:"ltr",html:"es"},
    en:{code:"EN",dir:"ltr",html:"en"},
    "zh-CN":{code:"ZH",dir:"ltr",html:"zh-CN"},
    ar:{code:"AR",dir:"rtl",html:"ar"},
    ja:{code:"JA",dir:"ltr",html:"ja"},
    pt:{code:"PT",dir:"ltr",html:"pt-BR"},
    it:{code:"IT",dir:"ltr",html:"it"},
    de:{code:"DE",dir:"ltr",html:"de"}
  };
  var ROUTES=[
    {en:"/services",es:"/es/servicios",key:"services"},
    {en:"/method",es:"/es/metodo",key:"method"},
    {en:"/about",es:"/es/quienes-somos",key:"about"},
    {en:"/contact",es:"/es/contacto",key:"contact"},
    {en:"/",es:"/es",key:"home"}
  ];
  var NAV={
    en:{services:"Services",method:"Method",about:"About",contact:"Contact"},
    es:{services:"Servicios",method:"Método",about:"Quiénes somos",contact:"Contacto"},
    ja:{services:"サービス",method:"方法",about:"概要",contact:"お問い合わせ"},
    "zh-CN":{services:"服务",method:"方法",about:"关于我们",contact:"联系"},
    ar:{services:"الخدمات",method:"المنهج",about:"من نحن",contact:"تواصل"},
    pt:{services:"Serviços",method:"Método",about:"Quem somos",contact:"Contacto"},
    it:{services:"Servizi",method:"Metodo",about:"Chi siamo",contact:"Contatto"},
    de:{services:"Leistungen",method:"Methode",about:"Über uns",contact:"Kontakt"}
  };
  function pref(){
    try{
      var s=localStorage.getItem(themeKey);
      if(s==="dark") return s;
      if(s==="light") return s;
    }catch(e){}
    var mq=window.matchMedia;
    if(mq){
      if(mq("(prefers-color-scheme: dark)").matches) return "dark";
    }
    return "light";
  }
  function applyTheme(t){
    root.setAttribute("data-theme", t);
    var b=document.getElementById("syn-theme-toggle");
    if(b){
      var dark=t==="dark";
      b.setAttribute("aria-pressed", dark?"true":"false");
      b.setAttribute("aria-label", dark?"Switch to light mode":"Switch to dark mode");
    }
  }
  applyTheme(pref());
  function path(){return (location.pathname.replace(/\/+$/,"")||"/");}
  function pair(){
    var p=path();
    var i;
    for(i=0;i<ROUTES.length;i++){
      if(p===ROUTES[i].en) return ROUTES[i];
      if(p===ROUTES[i].es) return ROUTES[i];
    }
    return ROUTES[ROUTES.length-1];
  }
  function abs(p){return "https://synergium.net"+(p==="/"?"/":p+"/");}
  function readCookie(n){
    var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));
    if(m) return decodeURIComponent(m[1]);
    return "";
  }
  function writeCookie(n,v){
    document.cookie=n+"="+v+";path=/;max-age=31536000";
    document.cookie=n+"="+v+";path=/;domain="+location.hostname+";max-age=31536000";
  }
  function expireCookie(n, domain){
    var base=n+"=;path=/;max-age=0;expires=Thu, 01 Jan 1970 00:00:00 GMT";
    if(domain) document.cookie=base+";domain="+domain;
    else document.cookie=base;
  }
  function expireGoogtrans(){
    var host=location.hostname;
    var names=["googtrans","googtranscombo"];
    var i,j,domains;
    domains=["",host,"."+host];
    for(i=0;i<names.length;i++){
      for(j=0;j<domains.length;j++){
        if(domains[j]) expireCookie(names[i], domains[j]);
        else expireCookie(names[i]);
      }
    }
  }
  function clearTrans(){
    expireGoogtrans();
    try{localStorage.removeItem("syn-lang");}catch(e){}
  }
  function qlang(){
    try{
      var q=new URLSearchParams(location.search).get("lang");
      if(q){
        if(LANGS[q]) return q;
      }
    }catch(e){}
    return "";
  }
  function currentLang(){
    var p=path();
    if(p==="/es") return "es";
    if(p.indexOf("/es/")===0) return "es";
    if(p==="/en") return "en";
    if(p.indexOf("/en/")===0) return "en";
    var ql=qlang();
    if(ql) return ql;
    var c=readCookie("googtrans");
    var m=c.match(/\/[a-zA-Z-]+\/([a-zA-Z-]+)/);
    if(m){
      if(m[1]==="en"){
        expireGoogtrans();
        return "en";
      }
      if(LANGS[m[1]]) return m[1];
    }
    try{
      var s=localStorage.getItem("syn-lang");
      if(s){
        if(LANGS[s]){
          if(s!=="en") return s;
        }
      }
    }catch(e){}
    return "en";
  }
  function paintNav(uiLang){
    var labels=NAV[uiLang]||NAV.en;
    var r=pair();
    var nav=document.getElementById("syn-nav");
    if(nav){
      nav.querySelectorAll("a[data-key]").forEach(function(a){
        var k=a.getAttribute("data-key");
        if(labels[k]) a.textContent=labels[k];
        var dest=null;
        var i;
        for(i=0;i<ROUTES.length;i++){if(ROUTES[i].key===k) dest=ROUTES[i];}
        if(dest){
          var href=abs(dest.en);
          if(uiLang==="es") href=abs(dest.es);
          else{
            if(uiLang!=="en") href=href+"?lang="+encodeURIComponent(uiLang);
          }
          a.setAttribute("href", href);
          if(r.key===k) a.setAttribute("aria-current","page");
          else a.removeAttribute("aria-current");
        }
      });
    }
    var logo=document.querySelector(".wp-block-site-title a");
    if(logo){
      if(uiLang==="es") logo.setAttribute("href","https://synergium.net/es/");
      else logo.setAttribute("href","https://synergium.net/");
    }
  }
  function paintLang(lang){
    var meta=LANGS[lang]||LANGS.en;
    root.setAttribute("lang", meta.html);
    root.setAttribute("dir", meta.dir);
    var code=document.getElementById("syn-lang-code");
    if(code) code.textContent=meta.code;
    var list=document.getElementById("syn-lang-list");
    if(list){
      list.querySelectorAll("[data-lang]").forEach(function(li){
        li.setAttribute("aria-selected", li.getAttribute("data-lang")===lang?"true":"false");
      });
    }
    paintNav(lang);
  }
  function goLang(lang){
    var r=pair();
    if(lang==="en"){
      clearTrans();
      writeCookie("googtrans","/en/en");
      location.href=abs(r.en)+"#googtrans(en|en)";
      return;
    }
    if(lang==="es"){
      clearTrans();
      location.href=abs(r.es);
      return;
    }
    writeCookie("googtrans","/en/"+lang);
    try{localStorage.setItem("syn-lang", lang);}catch(e){}
    location.href=abs(r.en)+"?lang="+encodeURIComponent(lang);
  }
  if(path()==="/en"){
    location.replace("https://synergium.net/");
    return;
  }
  if(path().indexOf("/en/")===0){
    location.replace("https://synergium.net/");
    return;
  }
  if(location.hash.indexOf("googtrans(en")===0){
    expireGoogtrans();
    try{localStorage.removeItem("syn-lang");}catch(e){}
    if(history.replaceState) history.replaceState(null,"",location.pathname);
  }
  if(location.hash.indexOf("#googtrans(en")===0){
    expireGoogtrans();
    try{localStorage.removeItem("syn-lang");}catch(e){}
    if(history.replaceState) history.replaceState(null,"",location.pathname);
  }
  paintLang(currentLang());
  var wrap=document.getElementById("syn-lang");
  var btn=document.getElementById("syn-lang-btn");
  var list=document.getElementById("syn-lang-list");
  if(btn){
    if(list){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        var open=wrap.classList.contains("is-open");
        if(open){
          wrap.classList.remove("is-open");
          btn.setAttribute("aria-expanded","false");
        }else{
          wrap.classList.add("is-open");
          btn.setAttribute("aria-expanded","true");
        }
      });
      list.addEventListener("click", function(ev){
        var a=ev.target.closest("a");
        if(!a) return;
        var li=a.closest("[data-lang]");
        if(!li) return;
        var lang=li.getAttribute("data-lang");
        ev.preventDefault();
        goLang(lang);
      });
      document.addEventListener("click", function(){
        wrap.classList.remove("is-open");
        btn.setAttribute("aria-expanded","false");
      });
    }
  }
  document.addEventListener("click", function(ev){
    var t=ev.target;
    var b=null;
    if(t.closest) b=t.closest("#syn-theme-toggle");
    if(!b) return;
    var next=root.getAttribute("data-theme")==="dark"?"light":"dark";
    try{localStorage.setItem(themeKey,next);}catch(e){}
    applyTheme(next);
  });
  var langNow=currentLang();
  var needGT=true;
  if(langNow==="es") needGT=false;
  if(langNow==="en") needGT=false;
  if(needGT){
    window.googleTranslateElementInit=function(){
      if(!window.google) return;
      if(!google.translate) return;
      new google.translate.TranslateElement({
        pageLanguage:"en",
        includedLanguages:"zh-CN,ar,ja,pt,it,de",
        autoDisplay:false
      },"google_translate_element");
    };
    setTimeout(function(){
      var s=document.createElement("script");
      s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      document.head.appendChild(s);
    },300);
  }
})();
</script>
