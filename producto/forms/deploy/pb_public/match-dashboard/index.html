<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline de matching — Synergium</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #fff;
      --text: #1a1d21;
      --muted: #5c6570;
      --border: #d8dde3;
      --accent: #0f4c81;
      --row-alt: #f0f2f5;
      --sticky-shadow: 0 1px 0 var(--border);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 600;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tabs {
      display: flex;
      gap: 4px;
    }
    .tabs button {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }
    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .search-wrap { flex: 1; min-width: 200px; }
    .search-wrap input {
      width: 100%;
      max-width: 360px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 160px);
      margin: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eef1f4;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--muted);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--sticky-shadow);
      white-space: nowrap;
    }
    thead th.th-sort {
      cursor: pointer;
      user-select: none;
    }
    thead th.th-sort:hover { background: #e4e8ec; }
    thead th.th-sort-active { color: var(--accent); }
    .sort-ind {
      margin-left: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: #e8edf2; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      white-space: nowrap;
    }
    .badge-step { background: #e3ecf4; color: #0f4c81; }
    .badge-pair-proposed { background: #fff3cd; color: #856404; }
    .badge-pair-active { background: #d4edda; color: #155724; }
    .badge-pair-discarded { background: #f8d7da; color: #721c24; }
    .badge-pair-completed { background: #cce5ff; color: #004085; }
    .badge-yes { background: #d4edda; color: #155724; }
    .badge-no { background: #f1f3f5; color: #6c757d; }
    .badge-status-active { background: #d4edda; color: #155724; }
    .badge-status-discarded { background: #f8d7da; color: #721c24; }
    .empty, .error {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .error { color: #a71d2a; }
    .ficha-wrap {
      display: flex;
      height: calc(100vh - 160px);
      background: var(--surface);
    }
    .ficha-list {
      width: min(300px, 38vw);
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--surface);
    }
    .ficha-list button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font: inherit;
      color: var(--text);
    }
    .ficha-list button:hover { background: var(--row-alt); }
    .ficha-list button.active {
      background: #e3ecf4;
      border-left: 3px solid var(--accent);
      padding-left: 11px;
    }
    .ficha-list .ficha-list-name {
      display: block;
      font-weight: 600;
      font-size: 13px;
    }
    .ficha-list .ficha-list-email {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .ficha-detail {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      background: var(--bg);
    }
    .ficha-detail h2 {
      margin: 0 0 4px;
      font-size: 17px;
    }
    .ficha-detail .ficha-sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 20px;
    }
    .ficha-section { margin-bottom: 24px; }
    .ficha-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin: 0 0 10px;
      font-weight: 600;
    }
    .kv-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 13px;
    }
    .kv-table th,
    .kv-table td {
      padding: 7px 10px;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .kv-table th {
      width: 34%;
      background: #eef1f4;
      font-weight: 600;
      font-size: 12px;
      color: var(--muted);
    }
    .email-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .email-block .email-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .email-block .email-subject {
      font-weight: 600;
      margin-bottom: 6px;
    }
    .email-block .email-body {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.5;
    }
    .ficha-empty {
      padding: 40px 20px;
      color: var(--muted);
      text-align: center;
    }
    .ficha-pipeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .ficha-pipeline-card h4 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    @media (max-width: 720px) {
      .ficha-wrap { flex-direction: column; height: auto; max-height: calc(100vh - 160px); }
      .ficha-list { width: 100%; max-height: 180px; border-right: none; border-bottom: 1px solid var(--border); }
    }
    @media (max-width: 640px) {
      .meta { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pipeline de matching</h1>
    <p>Vista operativa: pares curados, participantes del pipeline y directorio nexus-input</p>
  </header>
  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button type="button" class="active" data-view="matches" role="tab">Por match</button>
      <button type="button" data-view="participants" role="tab">Por participante</button>
      <button type="button" data-view="directory" role="tab">Directorio</button>
      <button type="button" data-view="ficha" role="tab">Ficha</button>
    </div>
    <div class="search-wrap">
      <input type="search" id="search" placeholder="Buscar nombre, email, eje, ref…" autocomplete="off">
    </div>
    <div class="meta" id="meta">Cargando…</div>
  </div>
  <div class="table-wrap" id="table-wrap">
    <table id="grid" hidden>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="empty" id="placeholder">Cargando datos…</div>
  </div>
  <div class="ficha-wrap" id="ficha-wrap" hidden>
    <div class="ficha-list" id="ficha-list" role="listbox" aria-label="Personas"></div>
    <div class="ficha-detail" id="ficha-detail">
      <div class="ficha-empty">Selecciona una persona de la lista.</div>
    </div>
  </div>

  <script>
    const MATCH_COLS = [
      { key: "match_number", label: "#", fmt: (r) => r.match_number },
      { key: "match_reference", label: "Ref", fmt: (r) => r.match_reference },
      { key: "slug", label: "Slug", fmt: (r) => r.slug },
      { key: "axis", label: "Eje", fmt: (r) => r.axis },
      { key: "pairing_status", label: "Emparejamiento", fmt: (r) => badgePairing(r.pairing_status) },
      { key: "pairing_method", label: "Método", fmt: (r) => r.pairing_method || "—" },
      { key: "proposed_at", label: "Propuesto", fmt: (r) => r.proposed_at || "—" },
      { key: "current_step", label: "Paso pipeline", fmt: (r) => badgeStep(r.current_step) },
      { key: "status", label: "Estado", fmt: (r) => badgeStatus(r.status) },
      { key: "person_a_name", label: "Persona A", fmt: (r) => personCell(r.person_a_name, r.person_a_email) },
      { key: "person_b_name", label: "Persona B", fmt: (r) => personCell(r.person_b_name, r.person_b_email) },
      { key: "opt_in_a_sent", label: "Opt-in A", fmt: (r) => badgeYN(r.opt_in_a_sent) },
      { key: "opt_in_b_sent", label: "Opt-in B", fmt: (r) => badgeYN(r.opt_in_b_sent) },
      { key: "last_contact_at", label: "Último contacto", fmt: (r) => r.last_contact_at || "—" },
      { key: "event_count", label: "Eventos", fmt: (r) => r.event_count ?? 0 },
      { key: "expediente_path", label: "Expediente", fmt: (r) => r.expediente_path ? `<a href="https://github.com/horacioeps/synergium/tree/main/${esc(r.expediente_path)}" target="_blank" rel="noopener">repo</a>` : "—" },
    ];

    const PART_COLS = [
      { key: "match_number", label: "#", fmt: (r) => r.match_number },
      { key: "match_reference", label: "Ref", fmt: (r) => r.match_reference },
      { key: "side", label: "Lado", fmt: (r) => (r.side || "").toUpperCase() },
      { key: "person_name", label: "Nombre", fmt: (r) => esc(r.person_name) },
      { key: "person_email", label: "Email", fmt: (r) => `<a href="mailto:${esc(r.person_email)}">${esc(r.person_email)}</a>` },
      { key: "whatsapp", label: "WhatsApp", fmt: (r) => r.whatsapp || "—" },
      { key: "current_step", label: "Paso", fmt: (r) => badgeStep(r.current_step) },
      { key: "is_paired", label: "Emparejado", fmt: (r) => badgeYN(r.is_paired) },
      { key: "paired_with_email", label: "Con", fmt: (r) => r.paired_with_email || "—" },
      { key: "pairing_proposed_at", label: "Propuesto", fmt: (r) => r.pairing_proposed_at || "—" },
      { key: "opt_in_sent", label: "Opt-in enviado", fmt: (r) => badgeYN(r.opt_in_sent) },
      { key: "last_contact_at", label: "Último contacto", fmt: (r) => r.last_contact_at || "—" },
    ];

    const DIR_COLS = [
      { key: "person_name", label: "Nombre", fmt: (r) => esc(r.person_name) },
      { key: "person_email", label: "Email", fmt: (r) => `<a href="mailto:${esc(r.person_email)}">${esc(r.person_email)}</a>` },
      { key: "country", label: "País", fmt: (r) => esc(r.country) || "—" },
      { key: "whatsapp", label: "WhatsApp", fmt: (r) => r.whatsapp || "—" },
      { key: "match_me_label", label: "Match me", fmt: (r) => esc(r.match_me_label || r.match_me) },
      { key: "is_paired", label: "Emparejado", fmt: (r) => badgeYN(r.is_paired) },
      { key: "match_reference", label: "Match", fmt: (r) => r.match_reference ? esc(r.match_reference) : "—" },
      { key: "paired_with_email", label: "Con", fmt: (r) => r.paired_with_email || "—" },
      { key: "current_step", label: "Paso", fmt: (r) => badgeStep(r.current_step) },
      { key: "last_contact_at", label: "Último contacto", fmt: (r) => r.last_contact_at || "—" },
      { key: "submitted_at", label: "Alta", fmt: (r) => r.submitted_at || "—" },
      { key: "source", label: "Origen", fmt: (r) => r.source || "—" },
    ];

    let data = null;
    let view = "matches";
    let query = "";
    let selectedFichaEmail = null;
    const sortState = {
      matches: { key: null, dir: "asc" },
      participants: { key: null, dir: "asc" },
      directory: { key: null, dir: "asc" },
      ficha: { key: "person_name", dir: "asc" },
    };

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function badgeStep(step) {
      if (!step) return "—";
      return `<span class="badge badge-step">${esc(step)}</span>`;
    }

    function badgePairing(status) {
      if (!status) return "—";
      const cls = {
        proposed: "badge-pair-proposed",
        active: "badge-pair-active",
        discarded: "badge-pair-discarded",
        completed: "badge-pair-completed",
        rejected: "badge-pair-discarded",
      }[status] || "badge-step";
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }

    function badgeStatus(status) {
      if (!status) return "—";
      const cls = status === "discarded" ? "badge-status-discarded" : "badge-status-active";
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }

    function badgeYN(val) {
      const yes = val === true || val === "true" || val === "Y" || val === "yes";
      return `<span class="badge ${yes ? "badge-yes" : "badge-no"}">${yes ? "Sí" : "No"}</span>`;
    }

    function personCell(name, email) {
      if (!name && !email) return "—";
      const n = esc(name || email);
      if (email) return `${n}<br><a href="mailto:${esc(email)}">${esc(email)}</a>`;
      return n;
    }

    function rowText(row, cols) {
      return cols.map((c) => {
        const v = row[c.key];
        return v == null ? "" : String(v);
      }).join(" ").toLowerCase();
    }

    function viewConfig() {
      if (view === "matches") return { cols: MATCH_COLS, rows: data.matches || [] };
      if (view === "directory") return { cols: DIR_COLS, rows: data.directory || [] };
      if (view === "ficha") return { cols: [], rows: data.profiles || [] };
      return { cols: PART_COLS, rows: data.participants || [] };
    }

    function profileSearchText(p) {
      const bits = [
        p.person_name, p.person_email, p.country, p.institution, p.city,
        p.match_me_label, p.whatsapp,
      ];
      (p.nexus_form || []).forEach((f) => bits.push(f.label, f.value));
      (p.pipeline || []).forEach((pl) => {
        bits.push(pl.match_reference, pl.paired_with_email, pl.axis, pl.current_step);
      });
      (p.contact_events || []).forEach((ev) => {
        bits.push(ev.event_type, ev.subject, ev.body, ev.notes, ev.match_reference);
      });
      (p.match_align || []).forEach((ma) => {
        bits.push(ma.match_reference);
        (ma.fields || []).forEach((f) => bits.push(f.label, f.value));
      });
      return bits.filter(Boolean).join(" ").toLowerCase();
    }

    function filteredProfiles() {
      const rows = data.profiles || [];
      const sort = sortState.ficha;
      let filtered = query
        ? rows.filter((p) => profileSearchText(p).includes(query.toLowerCase()))
        : rows;
      if (sort.key) filtered = sortRows(filtered, sort.key, sort.dir);
      return filtered;
    }

    function kvTable(rows) {
      if (!rows || !rows.length) return '<p class="ficha-empty">Sin datos.</p>';
      return '<table class="kv-table"><tbody>' + rows.map((r) =>
        `<tr><th>${esc(r.label)}</th><td>${esc(r.value).replace(/\n/g, "<br>")}</td></tr>`
      ).join("") + "</tbody></table>";
    }

    function renderFichaDetail(p) {
      const identity = [
        { label: "Nombre", value: p.person_name },
        { label: "Email", value: p.person_email },
        { label: "WhatsApp", value: p.whatsapp },
        { label: "País", value: p.country },
        { label: "Ciudad", value: p.city },
        { label: "Institución", value: p.institution },
        { label: "Match me", value: p.match_me_label || p.match_me },
        { label: "Alta formulario", value: p.submitted_at },
        { label: "Origen", value: p.nexus_source },
      ].filter((r) => r.value);

      let pipelineHtml = "";
      if (p.pipeline && p.pipeline.length) {
        pipelineHtml = p.pipeline.map((pl) => {
          const rows = [
            { label: "Match", value: pl.match_reference || (pl.match_number ? `#${pl.match_number}` : "") },
            { label: "Eje", value: pl.axis },
            { label: "Lado", value: (pl.side || "").toUpperCase() },
            { label: "Paso persona", value: pl.current_step },
            { label: "Paso match", value: pl.match_current_step },
            { label: "Emparejamiento", value: pl.pairing_status },
            { label: "Método", value: pl.pairing_method },
            { label: "Con", value: pl.paired_with_name ? `${pl.paired_with_name} <${pl.paired_with_email}>` : pl.paired_with_email },
            { label: "Propuesto", value: pl.pairing_proposed_at },
            { label: "Expediente", value: pl.expediente_path },
          ].filter((r) => r.value);
          return `<div class="ficha-pipeline-card"><h4>${esc(pl.match_reference || `Match #${pl.match_number || "?"}`)}</h4>${kvTable(rows)}</div>`;
        }).join("");
      } else {
        pipelineHtml = '<p class="ficha-empty">Sin participación en pipeline curado.</p>';
      }

      let emailsHtml = "";
      if (p.contact_events && p.contact_events.length) {
        emailsHtml = p.contact_events.map((ev) => {
          const meta = [
            ev.sent_at || "—",
            ev.event_type,
            ev.direction,
            ev.channel,
            ev.match_reference ? `ref: ${ev.match_reference}` : "",
          ].filter(Boolean).join(" · ");
          const body = ev.body || ev.notes || "(sin cuerpo)";
          return `<div class="email-block">
            <div class="email-meta">${esc(meta)}</div>
            ${ev.subject ? `<div class="email-subject">${esc(ev.subject)}</div>` : ""}
            <div class="email-body">${esc(body)}</div>
          </div>`;
        }).join("");
      } else {
        emailsHtml = '<p class="ficha-empty">Sin eventos de contacto.</p>';
      }

      let alignHtml = "";
      if (p.match_align && p.match_align.length) {
        alignHtml = p.match_align.map((ma, i) =>
          `<div class="ficha-pipeline-card"><h4>Brief ${i + 1}${ma.match_reference ? ` · ${esc(ma.match_reference)}` : ""}${ma.submitted_at ? ` · ${esc(ma.submitted_at)}` : ""}</h4>${kvTable(ma.fields)}</div>`
        ).join("");
      } else {
        alignHtml = '<p class="ficha-empty">Sin respuestas match-align.</p>';
      }

      return `
        <h2>${esc(p.person_name || p.person_email)}</h2>
        <p class="ficha-sub"><a href="mailto:${esc(p.person_email)}">${esc(p.person_email)}</a>${p.institution ? ` · ${esc(p.institution)}` : ""}${p.country ? ` · ${esc(p.country)}` : ""}</p>
        <div class="ficha-section"><h3>Identidad</h3>${kvTable(identity)}</div>
        <div class="ficha-section"><h3>Formulario nexus-input</h3>${kvTable(p.nexus_form)}</div>
        <div class="ficha-section"><h3>Pipeline</h3>${pipelineHtml}</div>
        <div class="ficha-section"><h3>Emails y contacto (${(p.contact_events || []).length})</h3>${emailsHtml}</div>
        <div class="ficha-section"><h3>Match-align</h3>${alignHtml}</div>
      `;
    }

    function renderFicha() {
      const listEl = document.getElementById("ficha-list");
      const detailEl = document.getElementById("ficha-detail");
      const profiles = filteredProfiles();

      if (!profiles.length) {
        listEl.innerHTML = "";
        detailEl.innerHTML = '<div class="ficha-empty">Sin resultados para la búsqueda.</div>';
        return;
      }

      if (!selectedFichaEmail || !profiles.some((p) => p.person_email === selectedFichaEmail)) {
        selectedFichaEmail = profiles[0].person_email;
      }

      listEl.innerHTML = profiles.map((p) => {
        const active = p.person_email === selectedFichaEmail ? " active" : "";
        return `<button type="button" class="${active.trim()}" data-email="${esc(p.person_email)}" role="option" aria-selected="${p.person_email === selectedFichaEmail}">
          <span class="ficha-list-name">${esc(p.person_name || p.person_email)}</span>
          <span class="ficha-list-email">${esc(p.person_email)}</span>
        </button>`;
      }).join("");

      const current = profiles.find((p) => p.person_email === selectedFichaEmail) || profiles[0];
      detailEl.innerHTML = renderFichaDetail(current);
    }

    function sortValue(val, key) {
      if (val == null || val === "") return "";
      if (key === "match_number" || key === "event_count") return Number(val) || 0;
      if (typeof val === "boolean") return val ? 1 : 0;
      if (val === true || val === "true" || val === "Y" || val === "yes") return 1;
      if (val === false || val === "false" || val === "N" || val === "no") return 0;
      return String(val).toLowerCase();
    }

    function sortRows(rows, key, dir) {
      if (!key) return rows;
      const mult = dir === "asc" ? 1 : -1;
      return [...rows].sort((a, b) => {
        const va = sortValue(a[key], key);
        const vb = sortValue(b[key], key);
        if (va < vb) return -1 * mult;
        if (va > vb) return 1 * mult;
        return 0;
      });
    }

    function toggleSort(key) {
      const s = sortState[view];
      if (s.key === key) s.dir = s.dir === "asc" ? "desc" : "asc";
      else {
        s.key = key;
        s.dir = "asc";
      }
      render();
    }

    function render() {
      if (!data) return;

      const tableWrap = document.getElementById("table-wrap");
      const fichaWrap = document.getElementById("ficha-wrap");
      const isFicha = view === "ficha";

      tableWrap.hidden = isFicha;
      fichaWrap.hidden = !isFicha;

      if (isFicha) {
        renderFicha();
        const stats = data.stats || {};
        const total = (data.profiles || []).length;
        const shown = filteredProfiles().length;
        document.getElementById("meta").textContent =
          `${shown}/${total} fichas · ${data.source} · ${data.exported_at || ""} · ${stats.events || 0} eventos`;
        return;
      }

      const { cols, rows } = viewConfig();
      const sort = sortState[view];
      const filtered = query
        ? rows.filter((r) => rowText(r, cols).includes(query.toLowerCase()))
        : rows;
      const sorted = sortRows(filtered, sort.key, sort.dir);

      const head = document.getElementById("head");
      const body = document.getElementById("body");
      const grid = document.getElementById("grid");
      const placeholder = document.getElementById("placeholder");

      head.innerHTML = "<tr>" + cols.map((c) => {
        const active = sort.key === c.key;
        const aria = active ? (sort.dir === "asc" ? "ascending" : "descending") : "none";
        const ind = active ? `<span class="sort-ind">${sort.dir === "asc" ? "↑" : "↓"}</span>` : "";
        return `<th class="th-sort${active ? " th-sort-active" : ""}" data-key="${esc(c.key)}" role="columnheader" aria-sort="${aria}">${esc(c.label)}${ind}</th>`;
      }).join("") + "</tr>";
      body.innerHTML = sorted.map((r) =>
        "<tr>" + cols.map((c) => `<td>${c.fmt(r)}</td>`).join("") + "</tr>"
      ).join("");

      grid.hidden = false;
      placeholder.hidden = true;
      if (!filtered.length) {
        placeholder.hidden = false;
        placeholder.textContent = "Sin resultados para la búsqueda.";
        grid.hidden = true;
      }

      const stats = data.stats || {};
      const dirNote = stats.submissions_total != null
        ? ` · PB: ${stats.directory}/${stats.submissions_total} en directorio`
        : "";
      document.getElementById("meta").textContent =
        `${sorted.length}/${rows.length} filas · ${data.source} · ${data.exported_at || ""}${dirNote}`;
    }

    async function load() {
      try {
        const res = await fetch("data.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
        render();
      } catch (err) {
        document.getElementById("placeholder").className = "error";
        document.getElementById("placeholder").textContent =
          "No se pudo cargar data.json. Ejecuta export_match_dashboard.py.";
        document.getElementById("meta").textContent = String(err.message || err);
      }
    }

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        view = btn.dataset.view;
        render();
      });
    });

    document.getElementById("search").addEventListener("input", (e) => {
      query = e.target.value.trim();
      render();
    });

    document.getElementById("head").addEventListener("click", (e) => {
      const th = e.target.closest("th[data-key]");
      if (th) toggleSort(th.dataset.key);
    });

    document.getElementById("ficha-list").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-email]");
      if (!btn) return;
      selectedFichaEmail = btn.dataset.email;
      renderFicha();
      document.querySelectorAll("#ficha-list button").forEach((b) => {
        const on = b.dataset.email === selectedFichaEmail;
        b.classList.toggle("active", on);
        b.setAttribute("aria-selected", on ? "true" : "false");
      });
    });

    load();
  </script>
</body>
</html>
