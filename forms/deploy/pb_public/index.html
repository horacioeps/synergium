<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#131313" />
  <title>Synergium Forms</title>
  <link rel="icon" href="https://synergium.net/wp-content/uploads/2026/08/synergium-icon-1024-150x150.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --base: #FFFFFF;
      --contrast: #111111;
      --accent: #503AA8;
      --accent-warm: #FF7A5C;
      --muted: color-mix(in srgb, var(--contrast) 58%, transparent);
      --border: color-mix(in srgb, var(--contrast) 18%, transparent);
      --field: color-mix(in srgb, var(--contrast) 4%, var(--base));
      --danger: #cf2e2e;
      --radius: 8px;
      --font: Manrope, system-ui, sans-serif;
    }
    html[data-theme="dark"] {
      --base: #131313;
      --contrast: #FFFFFF;
      --accent: #4B52FF;
      --accent-warm: #FF7A5C;
      --muted: color-mix(in srgb, var(--contrast) 62%, transparent);
      --border: color-mix(in srgb, var(--contrast) 22%, transparent);
      --field: #1b1b1b;
      --danger: #ff6b6b;
      color-scheme: dark;
    }
    html[data-theme="light"] { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--contrast);
      background: var(--base);
      line-height: 1.55;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 0;
    }
    .top__tools {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: nowrap;
    }
    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.72;
      text-decoration: none;
      color: inherit;
    }
    .brand:hover { text-decoration: underline; }
    .syn-lang { position: relative; }
    .syn-lang__btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.55rem;
      border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
      border-radius: 999px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }
    .syn-lang__btn:hover,
    .syn-lang__btn[aria-expanded="true"] { border-color: currentColor; }
    .syn-lang__globe { display: block; flex: 0 0 auto; }
    .syn-lang__code { line-height: 1; }
    .syn-lang__list {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      margin: 0;
      padding: 0.35rem 0;
      list-style: none;
      min-width: 10.5rem;
      border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      border-radius: 8px;
      background: var(--base);
      color: inherit;
      box-shadow: 0 8px 24px color-mix(in srgb, #000 16%, transparent);
      z-index: 20;
    }
    html[data-theme="dark"] .syn-lang__list { background: #1b1b1b; }
    .syn-lang__list[hidden] { display: none; }
    .syn-lang__list li {
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .syn-lang__list li:hover,
    .syn-lang__list li[aria-selected="true"] {
      background: color-mix(in srgb, currentColor 8%, transparent);
    }
    .theme {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
      border-radius: 999px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .theme:hover { border-color: currentColor; }
    .theme__moon { display: none; }
    html[data-theme="dark"] .theme__sun { display: none; }
    html[data-theme="dark"] .theme__moon { display: block; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }
    h1 {
      font-weight: 700;
      font-size: clamp(1.85rem, 4vw, 2.4rem);
      line-height: 1.15;
      margin: 0 0 0.85rem;
      letter-spacing: -0.02em;
    }
    .desc {
      color: var(--muted);
      white-space: pre-wrap;
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .field {
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .field:last-of-type { border-bottom: 0; }
    label.main {
      display: block;
      font-weight: 600;
      margin-bottom: 0.45rem;
      font-size: 0.95rem;
    }
    .req { color: var(--danger); margin-left: 0.2rem; }
    input[type="text"], input[type="email"], input[type="tel"], textarea, select {
      width: 100%;
      background: var(--field);
      border: 1px solid var(--border);
      color: var(--contrast);
      border-radius: var(--radius);
      padding: 0.7rem 0.85rem;
      font: inherit;
    }
    input:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .opts { display: grid; gap: 0.45rem; }
    .opt {
      display: flex; align-items: flex-start; gap: 0.55rem;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.55rem 0.7rem;
    }
    .opt input { margin-top: 0.2rem; }
    .other-wrap { margin-top: 0.5rem; display: none; }
    .other-wrap.show { display: block; }
    button.submit {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 1.35rem;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    html[data-theme="light"] button.submit { color: #111; background: var(--accent); }
    html[data-theme="light"] button.submit { background: #503AA8; color: #fff; }
    button.submit:hover { filter: brightness(1.06); }
    button.submit:disabled { opacity: 0.55; cursor: wait; }
    .err { color: var(--danger); margin: 0.75rem 0; }
    .ok {
      background: color-mix(in srgb, var(--accent) 12%, var(--base));
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .foot {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .loading, .missing { color: var(--muted); padding: 2rem 0; }
    #google_translate_element, .goog-te-banner-frame, .skiptranslate, iframe.skiptranslate, .goog-te-gadget { display: none !important; }
    body { top: 0 !important; }
  </style>
</head>
<body>
  <div id="google_translate_element" hidden></div>
  <div class="top" translate="no">
    <a class="brand" href="https://synergium.net/">Synergium</a>
    <div class="top__tools">
      <div class="syn-lang" id="syn-lang">
        <button type="button" class="syn-lang__btn" id="syn-lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="syn-lang-list" aria-label="Select language / Seleccionar idioma">
          <svg class="syn-lang__globe" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18"/>
            <path d="M12 3a14 14 0 0 1 0 18"/>
            <path d="M12 3a14 14 0 0 0 0 18"/>
          </svg>
          <span class="syn-lang__code" id="syn-lang-code">EN</span>
        </button>
        <ul class="syn-lang__list" id="syn-lang-list" role="listbox" hidden>
          <li role="option" data-lang="en" aria-selected="true">English</li>
          <li role="option" data-lang="es">Español</li>
          <li role="option" data-lang="zh-CN">简体中文</li>
          <li role="option" data-lang="ar">العربية</li>
          <li role="option" data-lang="ja">日本語</li>
          <li role="option" data-lang="pt">Português</li>
          <li role="option" data-lang="it">Italiano</li>
          <li role="option" data-lang="de">Deutsch</li>
        </ul>
      </div>
      <button type="button" class="theme" id="themeBtn" aria-label="Toggle light/dark">
        <svg class="theme__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap">
    <div id="app" class="loading">Loading…</div>
  </div>
  <script>
  (function initTheme() {
    const stored = localStorage.getItem("syn-theme");
    const pref = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", pref);
    document.getElementById("themeBtn").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("syn-theme", next);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", next === "dark" ? "#131313" : "#FFFFFF");
    });
  })();

  /** Same language set as synergium.net. Default EN for every form. */
  const LANGS = {
    en: { code: "EN", dir: "ltr", html: "en" },
    es: { code: "ES", dir: "ltr", html: "es" },
    "zh-CN": { code: "ZH", dir: "ltr", html: "zh-CN" },
    ar: { code: "AR", dir: "rtl", html: "ar" },
    ja: { code: "JA", dir: "ltr", html: "ja" },
    pt: { code: "PT", dir: "ltr", html: "pt-BR" },
    it: { code: "IT", dir: "ltr", html: "it" },
    de: { code: "DE", dir: "ltr", html: "de" },
  };
  const UI_FALLBACK = {
    submit: "Submit",
    sending: "Sending…",
    other: "Other",
    other_placeholder: "Other…",
    url_placeholder: "One URL per line",
    thank_you: "Thank you",
    foot: "Your answers are stored securely. Request deletion via WhatsApp.",
    complete: "Please complete: ",
    submit_error: "Could not submit. Please try again.",
    loading: "Loading…",
    missing_link: "Open a form link you were given.",
    missing_form: "This form is closed or the link is invalid.",
    load_error: "Could not load the form.",
  };

  const PB = window.location.origin;
  const app = document.getElementById("app");
  const CANONICAL_PUBLIC_ID = "nexus-input";
  const PUBLIC_ID_ALIASES = {
    "0mn7nfs5kqsi8g": "nexus-input",
    "nexus/input": "nexus-input",
  };
  const LEGACY_PUBLIC_IDS = new Set(["0mn7nfs5kqsi8g"]);

  let formRec = null;
  let formPublicId = null;
  let ui = { ...UI_FALLBACK };

  function readCookie(n) {
    const m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : "";
  }
  function writeCookie(n, v) {
    document.cookie = n + "=" + v + ";path=/;max-age=31536000";
    document.cookie = n + "=" + v + ";path=/;domain=" + location.hostname + ";max-age=31536000";
  }
  function clearTrans() {
    document.cookie = "googtrans=;path=/;max-age=0";
    document.cookie = "googtrans=;path=/;domain=" + location.hostname + ";max-age=0";
  }
  function currentLang() {
    try {
      const s = localStorage.getItem("syn-lang");
      if (s && LANGS[s]) return s;
    } catch (e) {}
    const c = readCookie("googtrans");
    const m = c.match(/\/[a-zA-Z-]+\/([a-zA-Z-]+)/);
    if (m && LANGS[m[1]]) return m[1];
    return "en";
  }
  function paintLang(lang) {
    const meta = LANGS[lang] || LANGS.en;
    document.documentElement.setAttribute("lang", meta.html);
    document.documentElement.setAttribute("dir", meta.dir);
    const code = document.getElementById("syn-lang-code");
    if (code) code.textContent = meta.code;
    const list = document.getElementById("syn-lang-list");
    if (list) {
      list.querySelectorAll("[data-lang]").forEach((li) => {
        li.setAttribute("aria-selected", li.getAttribute("data-lang") === lang ? "true" : "false");
      });
    }
  }
  function goLang(lang) {
    if (!LANGS[lang]) lang = "en";
    try { localStorage.setItem("syn-lang", lang); } catch (e) {}
    if (lang === "en" || lang === "es") {
      clearTrans();
      location.reload();
      return;
    }
    writeCookie("googtrans", "/en/" + lang);
    location.reload();
  }
  function ensureGoogleTranslate(lang) {
    if (lang === "en" || lang === "es") return;
    window.googleTranslateElementInit = function () {
      if (!window.google || !google.translate) return;
      new google.translate.TranslateElement({
        pageLanguage: "en",
        includedLanguages: "zh-CN,ar,ja,pt,it,de,es",
        autoDisplay: false,
      }, "google_translate_element");
    };
    setTimeout(function () {
      if (document.querySelector('script[src*="translate.google.com"]')) return;
      const s = document.createElement("script");
      s.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      document.head.appendChild(s);
    }, 200);
  }
  (function initLangUi() {
    const lang = currentLang();
    paintLang(lang);
    const btn = document.getElementById("syn-lang-btn");
    const list = document.getElementById("syn-lang-list");
    if (btn && list) {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const open = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", open ? "false" : "true");
        list.hidden = open;
      });
      list.addEventListener("click", (ev) => {
        const li = ev.target.closest("[data-lang]");
        if (!li) return;
        goLang(li.getAttribute("data-lang"));
      });
      document.addEventListener("click", () => {
        btn.setAttribute("aria-expanded", "false");
        list.hidden = true;
      });
    }
    if (lang !== "en" && lang !== "es") ensureGoogleTranslate(lang);
  })();

  function publicIdFromPath() {
    const parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
    if (parts.length === 0 || parts[0] === "index.html") return null;
    if (parts[0] === "f" && parts[1]) return parts.slice(1).join("-");
    return parts.length === 1 ? parts[0] : parts.join("-");
  }
  function resolvePublicId(pathId) {
    if (!pathId) return null;
    return PUBLIC_ID_ALIASES[pathId] || pathId;
  }
  function preferCanonicalUrl(pathId) {
    if (LEGACY_PUBLIC_IDS.has(pathId) || pathId === "nexus/input") {
      history.replaceState(null, "", "/" + CANONICAL_PUBLIC_ID + location.search + location.hash);
    }
  }
  function el(tag, attrs = {}, kids = []) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "className") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v !== undefined && v !== null) n.setAttribute(k, v);
    }
    for (const c of [].concat(kids)) if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    return n;
  }
  async function fetchForm(publicId) {
    const res = await fetch(`${PB}/api/sf/form/${encodeURIComponent(publicId)}`);
    if (res.status === 404) return null;
    if (!res.ok) throw new Error("Could not load form");
    return await res.json();
  }
  /** Optional native overlay: /i18n/{publicId}.{lang}.json — same field ids. Applies to every form. */
  async function fetchLocaleSchema(publicId, lang) {
    if (lang === "en") return null;
    try {
      const res = await fetch(`${PB}/i18n/${encodeURIComponent(publicId)}.${encodeURIComponent(lang)}.json`, { cache: "no-store" });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }
  function parseSchema(rec) {
    const schema = typeof rec.schema === "string" ? JSON.parse(rec.schema) : (rec.schema || {});
    return schema;
  }
  function displayBundle(rec, overlay) {
    const base = parseSchema(rec);
    const schema = overlay || base;
    ui = { ...UI_FALLBACK, ...(base.ui || {}), ...(overlay && overlay.ui ? overlay.ui : {}) };
    return {
      title: (overlay && overlay.title) || rec.title || base.title || "Form",
      description: (overlay && overlay.description) || rec.description || base.description || "",
      success_message: (overlay && overlay.success_message) || rec.success_message || base.success_message || "Your answers were saved.",
      fields: schema.fields || base.fields || [],
    };
  }
  function fieldNode(field) {
    const wrap = el("div", { className: "field", "data-id": field.id });
    const lab = el("label", { className: "main" }, [
      field.label,
      field.required ? el("span", { className: "req", text: "*" }) : null,
    ]);
    wrap.appendChild(lab);
    const name = field.id;
    if (["text", "email", "phone"].includes(field.type)) {
      const type = field.type === "phone" ? "tel" : field.type;
      wrap.appendChild(el("input", { type, name, required: field.required || null, autocomplete: field.type === "email" ? "email" : "off" }));
    } else if (field.type === "textarea" || field.type === "url_list") {
      wrap.appendChild(el("textarea", { name, required: field.required || null, placeholder: field.type === "url_list" ? ui.url_placeholder : "" }));
    } else if (field.type === "single_select") {
      const opts = el("div", { className: "opts" });
      const other = el("div", { className: "other-wrap" }, [
        el("input", { type: "text", name: name + "__other", placeholder: ui.other_placeholder }),
      ]);
      (field.options || []).forEach((o) => {
        const id = `${name}_${o.value}`;
        const input = el("input", { type: "radio", name, value: o.value, id, required: field.required || null });
        input.addEventListener("change", () => other.classList.toggle("show", false));
        opts.appendChild(el("label", { className: "opt", for: id }, [input, el("span", { text: o.label })]));
      });
      if (field.allow_other) {
        const id = `${name}_other`;
        const input = el("input", { type: "radio", name, value: "__other__", id });
        input.addEventListener("change", () => other.classList.add("show"));
        opts.appendChild(el("label", { className: "opt", for: id }, [input, el("span", { text: ui.other })]));
        opts.appendChild(other);
      }
      wrap.appendChild(opts);
    } else if (field.type === "multi_select") {
      const opts = el("div", { className: "opts" });
      const other = el("div", { className: "other-wrap" }, [
        el("input", { type: "text", name: name + "__other", placeholder: ui.other_placeholder }),
      ]);
      (field.options || []).forEach((o) => {
        const id = `${name}_${o.value}`;
        opts.appendChild(el("label", { className: "opt", for: id }, [
          el("input", { type: "checkbox", name, value: o.value, id }),
          el("span", { text: o.label }),
        ]));
      });
      if (field.allow_other) {
        const id = `${name}_other`;
        const cb = el("input", { type: "checkbox", name, value: "__other__", id });
        cb.addEventListener("change", () => other.classList.toggle("show", cb.checked));
        opts.appendChild(el("label", { className: "opt", for: id }, [cb, el("span", { text: ui.other })]));
        opts.appendChild(other);
      }
      wrap.appendChild(opts);
    } else if (field.type === "section") {
      wrap.appendChild(el("p", { className: "desc", text: field.label || "" }));
    }
    if (field.visible_if) {
      wrap.dataset.visibleIf = JSON.stringify(field.visible_if);
      wrap.style.display = "none";
    }
    return wrap;
  }
  function collectAnswers(formEl, fields) {
    const answers = {};
    for (const field of fields) {
      if (field.type === "section") continue;
      const name = field.id;
      if (field.type === "multi_select") {
        const checked = [...formEl.querySelectorAll(`input[name="${name}"]:checked`)].map((i) => i.value);
        const otherText = formEl.querySelector(`[name="${name}__other"]`)?.value?.trim();
        const vals = checked.filter((v) => v !== "__other__");
        if (checked.includes("__other__") && otherText) vals.push({ value: "other", other_text: otherText });
        answers[name] = vals;
      } else if (field.type === "single_select") {
        const picked = formEl.querySelector(`input[name="${name}"]:checked`)?.value;
        if (picked === "__other__") {
          answers[name] = { value: "other", other_text: formEl.querySelector(`[name="${name}__other"]`)?.value?.trim() || "" };
        } else {
          answers[name] = picked || "";
        }
      } else if (field.type === "url_list") {
        const raw = formEl.querySelector(`[name="${name}"]`)?.value || "";
        answers[name] = raw.split(/\n+/).map((s) => s.trim()).filter(Boolean);
      } else {
        answers[name] = formEl.querySelector(`[name="${name}"]`)?.value?.trim() || "";
      }
    }
    return answers;
  }
  function applyVisibility(root, fields) {
    const answers = collectAnswers(root, fields);
    for (const field of fields) {
      if (!field.visible_if) continue;
      const node = root.querySelector(`.field[data-id="${field.id}"]`);
      if (!node) continue;
      const { field: f, equals } = field.visible_if;
      node.style.display = answers[f] === equals ? "" : "none";
    }
  }
  function renderForm(rec, overlay) {
    const bundle = displayBundle(rec, overlay);
    const fields = bundle.fields;
    app.className = "";
    app.innerHTML = "";
    app.appendChild(el("h1", { text: bundle.title }));
    app.appendChild(el("div", { className: "desc", text: bundle.description }));
    const form = el("form", { novalidate: "novalidate" });
    const honeypot = el("input", { type: "text", name: "website", autocomplete: "off", tabindex: "-1", style: "position:absolute;left:-9999px;opacity:0", "aria-hidden": "true" });
    form.appendChild(honeypot);
    for (const f of fields) form.appendChild(fieldNode(f));
    form.addEventListener("change", () => applyVisibility(form, fields));
    applyVisibility(form, fields);
    const err = el("div", { className: "err" });
    const btn = el("button", { className: "submit", type: "submit", text: ui.submit });
    form.appendChild(err);
    form.appendChild(btn);
    form.appendChild(el("div", { className: "foot", text: ui.foot }));
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      if (honeypot.value) return;
      const answers = collectAnswers(form, fields);
      for (const f of fields) {
        if (f.visible_if) {
          const show = answers[f.visible_if.field] === f.visible_if.equals;
          if (!show) continue;
        }
        if (!f.required || f.type === "section") continue;
        const v = answers[f.id];
        const empty = v == null || v === "" || (Array.isArray(v) && v.length === 0);
        if (empty) {
          err.textContent = ui.complete + f.label;
          return;
        }
      }
      btn.disabled = true;
      btn.textContent = ui.sending;
      try {
        const body = {
          form: rec.id,
          answers,
          respondent_email: typeof answers.email === "string" ? answers.email : "",
          source: "web",
        };
        let res = await fetch(`${PB}/api/collections/submissions/records`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok && res.status === 400) {
          delete body.source;
          res = await fetch(`${PB}/api/collections/submissions/records`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
        }
        if (!res.ok) throw new Error(await res.text() || "Submit failed");
        app.innerHTML = "";
        app.appendChild(el("div", { className: "ok" }, [
          el("h1", { text: ui.thank_you }),
          el("p", { text: bundle.success_message }),
        ]));
      } catch (ex) {
        err.textContent = ui.submit_error;
        console.error(ex);
        btn.disabled = false;
        btn.textContent = ui.submit;
      }
    });
    app.appendChild(form);
    document.title = bundle.title + " — Synergium";
  }

  (async () => {
    const lang = currentLang();
    app.textContent = UI_FALLBACK.loading;
    const pathId = publicIdFromPath();
    if (!pathId) {
      app.className = "missing";
      app.textContent = UI_FALLBACK.missing_link;
      return;
    }
    preferCanonicalUrl(pathId);
    const id = resolvePublicId(pathId);
    try {
      let rec = await fetchForm(id);
      if (!rec && id !== pathId) rec = await fetchForm(pathId);
      if (!rec && pathId !== CANONICAL_PUBLIC_ID) rec = await fetchForm(CANONICAL_PUBLIC_ID);
      if (!rec) {
        app.className = "missing";
        app.textContent = UI_FALLBACK.missing_form;
        return;
      }
      formRec = rec;
      formPublicId = rec.public_id || id;
      let overlay = null;
      if (lang === "es") {
        overlay = await fetchLocaleSchema(formPublicId, "es");
        if (!overlay) {
          writeCookie("googtrans", "/en/es");
          ensureGoogleTranslate("es");
        } else {
          clearTrans();
        }
      } else if (lang !== "en") {
        ensureGoogleTranslate(lang);
      }
      renderForm(rec, overlay);
    } catch (e) {
      console.error(e);
      app.className = "missing";
      app.textContent = UI_FALLBACK.load_error;
    }
  })();
  </script>
  </script>
</body>
</html>
