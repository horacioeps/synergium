<script>
(function(){
  try{
    var t=localStorage.getItem("syn-theme");
    if(!t)t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    document.documentElement.setAttribute("data-theme",t);
  }catch(e){}
  var p=location.pathname.replace(/\/+$/,"")||"/";
  if(p==="/en"||p.indexOf("/en/")===0) document.documentElement.setAttribute("lang","en");
})();
</script>

  <button type="button" class="syn-theme" id="syn-theme-toggle" aria-pressed="false" aria-label="Switch to dark mode / Cambiar a modo oscuro" title="Light / Dark">

  </button>

<style>
.syn-toolbar{display:flex;align-items:center;gap:1rem;flex-wrap:nowrap}
.syn-lang{display:flex;align-items:center;gap:.45rem;font-size:.9rem;letter-spacing:.04em}
.syn-lang__flag{display:inline-flex;align-items:center;justify-content:center;width:20px;height:14px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,currentColor 22%,transparent);flex:0 0 auto}
.syn-lang__flag svg{display:block}
.syn-flag-uk{display:none}
html[lang="en"] .syn-flag-es{display:none}
html[lang="en"] .syn-flag-uk{display:block}
.syn-lang a{color:inherit;text-decoration:none;opacity:.55}
.syn-lang a.is-active,.syn-lang a:hover{opacity:1;text-decoration:underline;text-underline-offset:3px}
.syn-theme{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid color-mix(in srgb, currentColor 35%, transparent);border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.syn-theme:hover{border-color:currentColor}
.syn-theme__moon{display:none}
html[data-theme="dark"] .syn-theme__sun{display:none}
html[data-theme="dark"] .syn-theme__moon{display:block}
html[data-theme="dark"]{
  --wp--preset--color--base:#131313;
  --wp--preset--color--contrast:#FFFFFF;
  --wp--preset--color--accent-1:#4B52FF;
  --wp--preset--color--accent-2:#FF7A5C;
  --wp--preset--color--accent-3:#252525;
  --wp--preset--color--accent-4:#FFFFFF;
  --wp--preset--color--accent-5:#252525;
  --wp--preset--color--accent-6:#FFFFFF33;
  color-scheme:dark;
  background:#131313;
}
html[data-theme="light"]{color-scheme:light}
</style>
<script>
(function(){
  var root=document.documentElement;
  var key="syn-theme";
  function pref(){
    try{var s=localStorage.getItem(key);if(s==="dark"||s==="light")return s;}catch(e){}
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  }
  function apply(t){
    root.setAttribute("data-theme", t);
    var b=document.getElementById("syn-theme-toggle");
    if(b){
      var dark=t==="dark";
      b.setAttribute("aria-pressed", dark?"true":"false");
      b.setAttribute("aria-label", dark?"Switch to light mode / Cambiar a modo claro":"Switch to dark mode / Cambiar a modo oscuro");
    }
  }
  apply(pref());
  function path(){return (location.pathname.replace(/\/+$/,"")||"/");}
  var p=path();
  var isEn=p==="/en"||p.indexOf("/en/")===0;
  if(isEn) document.documentElement.setAttribute("lang","en");
  var es=document.querySelector(".syn-lang__es");
  var en=document.querySelector(".syn-lang__en");
  if(es&&en){
    if(isEn){en.classList.add("is-active");en.setAttribute("aria-current","page");}
    else {es.classList.add("is-active");es.setAttribute("aria-current","page");}
  }
  document.addEventListener("click", function(ev){
    var b=ev.target.closest&&ev.target.closest("#syn-theme-toggle");
    if(!b) return;
    var next=root.getAttribute("data-theme")==="dark"?"light":"dark";
    try{localStorage.setItem(key,next);}catch(e){}
    apply(next);
  });
})();
</script>
